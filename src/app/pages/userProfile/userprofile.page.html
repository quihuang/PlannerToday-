<ion-header>
  <ion-toolbar>
    <ion-title>Mi Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="perfil-container">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Información Personal</ion-card-title>
        <ion-card-subtitle>Actualiza tus datos cuando quieras.</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <ion-list lines="full">
          <ion-item>
            <ion-label position="floating">Nombres</ion-label>
            <ion-input [(ngModel)]="usuario.nombres"></ion-input>
          </ion-item>

          <ion-item>
            <ion-label position="floating">Apellidos</ion-label>
            <ion-input [(ngModel)]="usuario.apellidos"></ion-input>
          </ion-item>

          <ion-item>
            <ion-label position="floating">Edad</ion-label>
            <ion-input type="number" [(ngModel)]="usuario.edad"></ion-input>
          </ion-item>

          <ion-item>
            <ion-label position="floating">Correo Electrónico</ion-label>
            <ion-input type="email" [(ngModel)]="usuario.email"></ion-input>
          </ion-item>

          <ion-item>
            <ion-label position="floating">Contraseña</ion-label>
            <ion-input [type]="verClave ? 'text' : 'password'" [(ngModel)]="usuario.clave"></ion-input>          
          </ion-item>
        </ion-list>

        <div class="botones">
          <ion-button expand="block" (click)="actualizarPerfil()" color="primary">
            Actualizar Perfil
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
